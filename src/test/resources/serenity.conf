serenity {
  project.name = "Space & Beyond - E2E Booking Automation"
  take.screenshots = FOR_FAILURES
  full.screenshot.disabled = true
  linked.tags = "issue"
  restart.browser.for.each = scenario
  report.show.step.details = true
  console.headings = normal
  requirements.dir = "src/test/resources/features"
  test.root = "features"
  timeout = 8000
}

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "disable-dev-shm-usage",
        "no-sandbox",
        "disable-gpu",
        "disable-search-engine-choice-screen",
        "disable-notifications",
        "disable-infobars",
        "window-size=1920,1080",
        # en-US so the app accepts +1787 (Puerto Rico) phone numbers
        "lang=en-US"
      ]
      excludeSwitches = ["enable-automation"]
      prefs {
        "intl.accept_languages" = "en-US,en"
      }
    }
  }
  timeouts {
    implicitlywait = 2000
  }
}

environments {
  default {
    webdriver.base.url = "https://demo.testim.io"
  }
}
