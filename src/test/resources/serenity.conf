serenity {
  project.name = "Space & Beyond - E2E Booking Automation"
  take.screenshots = FOR_FAILURES
  full.screenshot.disabled = true
  linked.tags = "issue"
  restart.browser.for.each = scenario
  report.show.step.details = true
  console.headings = normal
  requirements.dir = "src/test/resources/features"
  test.root = "features"
  timeout = 8000
}

# Default browser. Override per run: -Dwebdriver.driver=firefox | edge
webdriver {
  driver = chrome
  capabilities {
    # Serenity picks ChromeOptions vs EdgeOptions internally based on this value;
    # it must track the selected driver, not be hardcoded to one browser.
    browserName = ${webdriver.driver}
    acceptInsecureCerts = true

    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "disable-dev-shm-usage",
        "no-sandbox",
        "disable-gpu",
        "disable-search-engine-choice-screen",
        "disable-notifications",
        "disable-infobars",
        "window-size=1920,1080",
        # en-US so the app accepts +1787 (Puerto Rico) phone numbers
        "lang=en-US"
      ]
      excludeSwitches = ["enable-automation"]
      prefs {
        "intl.accept_languages" = "en-US,en"
      }
    }

    "ms:edgeOptions" {
      args = [
        "remote-allow-origins=*",
        "disable-dev-shm-usage",
        "no-sandbox",
        "disable-gpu",
        "disable-notifications",
        "disable-infobars",
        "window-size=1920,1080",
        "lang=en-US"
      ]
      excludeSwitches = ["enable-automation"]
      prefs {
        "intl.accept_languages" = "en-US,en"
      }
    }

    "moz:firefoxOptions" {
      args = ["-width=1920", "-height=1080"]
      prefs {
        "intl.accept_languages" = "en-US, en"
      }
    }
  }
  timeouts {
    implicitlywait = 2000
  }
}

environments {
  default {
    webdriver.base.url = "https://demo.testim.io"
  }
}
